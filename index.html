<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Controle de Alunos</title><meta name="theme-color" content="#1f64bd"></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root {
  /* Layout: cabeçalho com marca da escola e status; duas abas. Dashboards abre com "Hoje ao vivo"; Preencher é a chamada rápida (uma linha por horário, salva sozinha) */
  --bg: #eef2f7;
  --surface: #ffffff;
  --surface-2: #f4f6fb;
  --line: #e1e6ef;
  --ink: #121a26;
  --muted: #5b6a7e;
  --accent: #2a78d6;
  --accent-text: #1c5cab;
  --accent-soft: rgba(42, 120, 214, .12);
  --btn: #1f64bd;
  --btn-ink: #ffffff;
  --ok: #15845a;
  --ok-soft: #dff4ea;
  --rep: #a96300;
  --rep-soft: #fcefd6;
  --bad: #c9342f;
  --bad-soft: #fde5e4;
  --shadow: 0 1px 2px rgba(18, 26, 38, .06), 0 6px 18px rgba(18, 26, 38, .05);
  --font-ui: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Space Grotesk', 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #161d27; --surface-2: #1c2531; --line: #28323f;
    --ink: #e7ecf3; --muted: #93a1b5;
    --accent: #3987e5; --accent-text: #86b6ef; --accent-soft: rgba(57, 135, 229, .2);
    --btn: #6da7ec; --btn-ink: #0b1018;
    --ok: #3fd096; --ok-soft: rgba(63, 208, 150, .14);
    --rep: #f2b84b; --rep-soft: rgba(242, 184, 75, .14);
    --bad: #ff807b; --bad-soft: rgba(255, 128, 123, .14);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #161d27; --surface-2: #1c2531; --line: #28323f;
  --ink: #e7ecf3; --muted: #93a1b5;
  --accent: #3987e5; --accent-text: #86b6ef; --accent-soft: rgba(57, 135, 229, .2);
  --btn: #6da7ec; --btn-ink: #0b1018;
  --ok: #3fd096; --ok-soft: rgba(63, 208, 150, .14);
  --rep: #f2b84b; --rep-soft: rgba(242, 184, 75, .14);
  --bad: #ff807b; --bad-soft: rgba(255, 128, 123, .14);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.45 var(--font-ui);
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 26px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
h2 { font-size: 20px; font-weight: 600; line-height: 1.2; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.25; }
p { margin: 0; }
.sub { color: var(--muted); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand img { height: 44px; max-width: 160px; width: auto; object-fit: contain; border-radius: 8px; }
.eyebrow { color: var(--accent-text); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .08em; }
.topright { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.conn { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font: 500 12px var(--font-ui); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn.on i { background: var(--ok); }
.conn.warn i { background: var(--rep); }
.conn.bad i { background: var(--bad); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); color: var(--ink); font: 500 13px var(--font-ui); cursor: pointer;
}
.btn:hover { background: var(--accent-soft); border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--btn); }
.btn.big { min-height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad); }
.btn.armed, .btn.armed:hover { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.icon { width: 38px; padding: 0; font-size: 20px; line-height: 1; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 12px; border-radius: 8px; }

.tabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; align-self: flex-start; max-width: 100%; }
.tab { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 9px 20px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 14px var(--font-ui); cursor: pointer; }
.tab:hover { background: var(--surface-2); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--btn); color: var(--btn-ink); }
.badge { min-width: 20px; padding: 0 6px; border-radius: 99px; background: var(--bad); color: #fff; font: 700 11px/20px var(--font-ui); text-align: center; }

.card { min-width: 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); }
.card.empty { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; padding: 24px; }
.view { display: flex; flex-direction: column; gap: 16px; }
.view[hidden] { display: none; }

.rangebar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.seg button { min-height: 32px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: 600 13px var(--font-ui); cursor: pointer; }
.seg button:hover { background: var(--surface-2); color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.rangelabel { color: var(--muted); font-size: 13px; }
.banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-radius: 12px; background: var(--rep-soft); color: var(--ink); }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.kpi { min-width: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.kpi.hero { background: var(--accent-soft); border-color: transparent; }
.kl { display: flex; align-items: center; gap: 7px; color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .06em; }
.kv { font: 600 32px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.kd { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; font: 600 12px var(--font-ui); color: var(--muted); }
.kd.good { color: var(--ok); } .kd.bad { color: var(--bad); }
.kd span { color: var(--muted); font-weight: 400; }
.km { color: var(--muted); font-size: 12px; }
.dotc { flex: none; width: 8px; height: 8px; border-radius: 50%; }
.c-a { background: var(--muted); } .c-p { background: var(--ok); } .c-r { background: var(--rep); } .c-f { background: var(--bad); } .c-x { background: var(--accent); }

.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.alert .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--font-ui); }
.alert.warn .ic { background: var(--rep-soft); color: var(--rep); }
.alert.bad .ic { background: var(--bad-soft); color: var(--bad); }
.alert.ok .ic { background: var(--ok-soft); color: var(--ok); }
.alert .tx { min-width: 0; flex: 1; }
.alert b { font-weight: 600; }
.alert .dt { color: var(--muted); font-size: 12px; }

.live { display: flex; flex-direction: column; gap: 12px; }
.lhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.ltiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; }
.ltile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; font: 500 12px var(--font-ui); min-width: 0; }
.ltile:hover { border-color: var(--accent); }
.ltile.now { border-color: var(--btn); background: var(--accent-soft); }
.ltile .t1 { color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .05em; font-variant-numeric: tabular-nums; }
.ltile .t2 { font: 600 20px/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.ltile .t3 { color: var(--muted); font-size: 12px; }
.ltile.miss .t3 { color: var(--rep); font-weight: 600; }
.ltile.okk .t2 { color: var(--ok); } .ltile.low .t2 { color: var(--rep); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; }
.ch { display: flex; flex-direction: column; gap: 10px; }
.chead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.chead p { color: var(--muted); font-size: 12px; }
.chart { width: 100%; min-height: 230px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.note { padding: 40px 8px; text-align: center; color: var(--muted); }
.ax { fill: var(--muted); font: 11px var(--font-ui); }
.vl { fill: var(--ink); font: 600 11px var(--font-ui); }
.grid-l { stroke: var(--line); stroke-width: 1; }
.ml { fill: var(--muted); font: 600 11px var(--font-ui); }
.pt .hit { fill: transparent; }
.pt .xh { stroke: var(--muted); stroke-width: 1; opacity: 0; }
.pt .hv { fill: var(--accent); stroke: var(--surface); stroke-width: 2; opacity: 0; }
.pt:hover .xh, .pt:hover .hv { opacity: 1; }
.pt .bar { fill: var(--accent); }
.pt:hover .bar { opacity: .82; }

.heat { display: grid; grid-template-columns: 44px repeat(6, minmax(0, 1fr)); gap: 4px; }
.hh { color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .05em; text-align: center; align-self: end; padding-bottom: 2px; }
.hr { color: var(--muted); font: 500 12px var(--font-ui); display: flex; align-items: center; font-variant-numeric: tabular-nums; }
.hc { min-height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); background: color-mix(in srgb, var(--accent) calc(var(--p, 0) * 1%), var(--surface-2)); color: var(--ink); font: 600 12px var(--font-ui); font-variant-numeric: tabular-nums; }
.hc.hi { color: #fff; }
.hc.empty { color: var(--muted); font-weight: 400; background: var(--surface-2); }
.hc.na { background: repeating-linear-gradient(135deg, transparent 0 4px, var(--line) 4px 5px); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: 12px; }
.legend .ramp { width: 120px; height: 8px; border-radius: 99px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, var(--surface-2)), var(--accent)); box-shadow: inset 0 0 0 1px var(--line); }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; min-width: 560px; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 12px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { background: var(--surface-2); color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .06em; }
tbody tr:last-child td { border-bottom: 0; }
td.good { color: var(--ok); font-weight: 600; } td.bad { color: var(--bad); font-weight: 600; }
details.tbl summary { cursor: pointer; font: 600 14px var(--font-display); margin-bottom: 12px; }

.chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 99px; font: 600 12px var(--font-ui); background: var(--surface-2); color: var(--muted); width: fit-content; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--rep-soft); color: var(--rep); }
.chip.acc { background: var(--accent-soft); color: var(--accent-text); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* chamada rápida */
.qbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
.qbar .l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.qbar input[type="date"] { min-height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 14px var(--font-ui); }
.sv[hidden] { display: none; }
.sv { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--font-ui); color: var(--muted); }
.sv i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sv.saved i { background: var(--ok); } .sv.saving i, .sv.pending i { background: var(--rep); } .sv.error i { background: var(--bad); }
.sv.error { color: var(--bad); }
.offsw { display: flex; align-items: center; gap: 10px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-weight: 500; cursor: pointer; }
.offsw input { width: 18px; height: 18px; accent-color: var(--btn); }
.qlist { display: flex; flex-direction: column; gap: 8px; }
.qlist[hidden] { display: none; }
.qhead, .qgrid { display: grid; grid-template-columns: 150px repeat(4, minmax(0, 1fr)) 200px 178px; gap: 10px; align-items: center; grid-template-areas: "time v p r f stat act"; }
.qhead { padding: 0 15px; color: var(--muted); font: 600 11px var(--font-ui); text-transform: uppercase; letter-spacing: .06em; }
.qhead span { text-align: center; }
.qhead span:first-child, .qhead span:nth-child(6) { text-align: left; }
.qrow { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.qrow.now { border-color: var(--btn); }
.qtime { grid-area: time; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.qtime b { font: 600 16px var(--font-display); font-variant-numeric: tabular-nums; }
.qtag { padding: 1px 8px; border-radius: 99px; font: 700 10px var(--font-ui); text-transform: uppercase; letter-spacing: .05em; }
.qtag.now { background: var(--btn); color: var(--btn-ink); }
.qtag.miss { background: var(--rep-soft); color: var(--rep); }
.qf { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.qf.v { grid-area: v; } .qf.p { grid-area: p; } .qf.r { grid-area: r; } .qf.f { grid-area: f; }
.qf label { display: none; align-items: center; gap: 6px; font: 600 12px var(--font-ui); }
.qs { display: flex; align-items: stretch; overflow: hidden; height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.qs:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.qs button { flex: none; width: 34px; border: 0; background: transparent; color: var(--ink); font: 500 19px var(--font-ui); cursor: pointer; }
.qs button:hover { background: var(--accent-soft); }
.qs input { flex: 1; min-width: 0; width: 100%; padding: 0; border: 0; background: transparent; color: var(--ink); text-align: center; font: 600 20px var(--font-display); font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.qs input::-webkit-outer-spin-button, .qs input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qs input:focus { outline: none; }
.qstat { grid-area: stat; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.qpct { font: 700 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--muted); }
.qpct.ok { color: var(--ok); } .qpct.low { color: var(--rep); } .qpct.chk { color: var(--bad); } .qpct.live { color: var(--accent-text); }
.qsub { color: var(--muted); font-size: 12px; }
.qact { grid-area: act; display: flex; flex-wrap: wrap; gap: 6px; }
.qwarn { padding: 8px 10px; border-radius: 9px; background: var(--bad-soft); color: var(--bad); font-size: 12px; }
.qwarn[hidden], .qdet[hidden] { display: none; }
.qsug { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-text); font-size: 12px; }
.qsug[hidden], .nsug[hidden] { display: none; }
.qdet .wide { grid-column: 1 / -1; }
.nsug { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); border-radius: 99px; padding: 5px 11px; font: 600 12px var(--font-ui); cursor: pointer; }
.nchip:hover { background: var(--accent-soft); }
#pendBar { display: flex; flex-direction: column; gap: 8px; }
#pendBar:empty { display: none; }
.banner.sugb { background: var(--accent-soft); }
.drow.call { grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1fr) auto; }
.qdet { display: grid; grid-template-columns: minmax(150px, 220px) minmax(0, 1fr); gap: 10px; align-items: end; padding-top: 10px; border-top: 1px dashed var(--line); }
.qdet .field { display: flex; flex-direction: column; gap: 4px; }
.qdet label { font: 600 12px var(--font-ui); }
.fcur, .fobs { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); color: var(--ink); font: 13px var(--font-ui); }
.fobs { resize: vertical; }
.qtot { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; color: var(--muted); font-size: 13px; }
.qtot b { color: var(--ink); font-variant-numeric: tabular-nums; }
@media (max-width: 899.98px) {
  .qhead { display: none; }
  .qgrid { grid-template-columns: 1fr 1fr; grid-template-areas: "time time" "stat stat" "v p" "r f" "act act"; }
  .qf label { display: flex; }
  .qdet { grid-template-columns: minmax(0, 1fr); }
}

.stabs, .qnav { display: none; }
@media (max-width: 700px) {
  .stabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scroll-snap-type: x proximity; }
  .stab { flex: none; scroll-snap-align: center; min-width: 68px; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: 600 12px var(--font-ui); cursor: pointer; }
  .stab b { font: 700 15px var(--font-display); }
  .stab span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .stab.ok { border-color: var(--ok); } .stab.ok span { color: var(--ok); }
  .stab.low { border-color: var(--rep); } .stab.low span { color: var(--rep); }
  .stab.chk { border-color: var(--bad); } .stab.chk span { color: var(--bad); }
  .stab.live span { color: var(--accent-text); }
  .stab.miss { background: var(--rep-soft); border-style: dashed; } .stab.miss span { color: var(--rep); }
  .stab.sel { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); } .stab.sel span { color: var(--btn-ink); opacity: .85; }
  .qrow:not(.sel) { display: none; }
  .qs { height: 56px; } .qs button { width: 52px; font-size: 22px; } .qs input { font-size: 26px; }
  .qpct { font-size: 30px; }
  .qact .btn { min-height: 44px; flex: 1 1 0; }
  .qnav { display: flex; gap: 10px; margin-top: 12px; }
  .qnav .btn { flex: 1; min-height: 48px; }
}
.drows { display: flex; flex-direction: column; margin-top: 10px; }
.drow { display: grid; grid-template-columns: 110px 130px minmax(0, 1fr) auto; align-items: center; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--line); }

<script>
(() => {
'use strict';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addD = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const today = () => sod(new Date());
const dowOf = d => (d.getDay() + 6) % 7;            // 0 = segunda ... 6 = domingo
const DS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const DL = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'];
const ML = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
const dm = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1);
const dayTag = d => DS[dowOf(d)] + ' ' + dm(d);
const clamp = v => { v = parseInt(v, 10); return isNaN(v) ? 0 : Math.min(999, Math.max(0, v)); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => v.toLocaleString('pt-BR', { maximumFractionDigits: d, minimumFractionDigits: d });
const rate = (n, d) => d > 0 ? n / d * 100 : null;
const slotsOf = dow => dow === 6 ? [] : (dow === 5 ? [8, 10, 13, 15] : [8, 10, 12, 14, 16, 18, 20]);
/* horários do formulário: os do dia da semana mais qualquer horário antigo que já tenha dados salvos */
const slotHours = (dow, doc) => { const s = new Set(slotsOf(dow)); if (doc && doc.s) Object.keys(doc.s).forEach(k => { const e = doc.s[k] || {}; if ((e.v || e.a || 0) + (e.p || 0) + (e.r || 0) + (e.f || 0) > 0) s.add(+k); }); return Array.from(s).sort((a, b) => a - b); };
const endOf = (dow, h) => h + 2;
const hh = h => pad(h) + ':00';
const HOURS = [8, 10, 12, 13, 14, 15, 16, 18, 20];
const hourNow = () => { const n = new Date(); return n.getHours() + n.getMinutes() / 60; };
const slotEnded = (date, dow, h) => { const t = iso(today()); return date < t || (date === t && hourNow() >= endOf(dow, h)); };
const slotNow = (date, dow, h) => date === iso(today()) && hourNow() >= h && hourNow() < endOf(dow, h);
/* Passados "tol" minutos do início, quem foi vendido e não veio já conta como falta. */
const tolMin = () => S.cfg.tol || 30;
const closeAt = (dow, h) => Math.min(endOf(dow, h), h + tolMin() / 60);
const slotClosed = (date, dow, h) => { const t = iso(today()); return date < t || (date === t && hourNow() >= closeAt(dow, h)); };
const clockOf = x => pad(Math.floor(x)) + ':' + pad(Math.round((x % 1) * 60) % 60);

/* ---------- estado e armazenamento ---------- */
const S = { days: {}, cfg: { meta: 85, capSem: 10, capSab: 25, escola: '', cor: 'azul', tol: 30, avisos: {} }, logo: '', mode: 'loading', loaded: false, synced: false, slow: false, err: null, demo: false, demoDays: null, range: '7', heat: 'faltas', tab: 'dashboards', dbh: null };
let D = null, saveT = null, savingP = null, saveAgain = false;
const LS2 = 'controle-alunos-v2', LS1 = 'controle-alunos-v1', LSI = 'controle-alunos-importado';
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
const getDays = () => S.demo ? S.demoDays : S.days;
const capDef = dow => dow === 5 ? S.cfg.capSab : S.cfg.capSem;

/* Um período salvo: { cap: vagas, v: vendidos, p: presentes, r: reposição, f: faltas, c: cursos }.
   Lançamentos antigos tinham só "a": viram vendidos. Depois que o horário termina, quem foi vendido e não veio conta como falta. */
function normSlot(e, dow) {
  e = e || {};
  const v = (e.v !== undefined && e.v !== null) ? clamp(e.v) : clamp(e.a);
  const cap = (e.cap !== undefined && e.cap !== null && clamp(e.cap) > 0) ? clamp(e.cap) : capDef(dow);
  return { cap, v, p: clamp(e.p), r: clamp(e.r), f: clamp(e.f), c: e.c || '', n: typeof e.n === 'string' ? e.n : '' };
}
function effSlot(raw, date, dow, h) {
  const n = normSlot(raw, dow);
  if (n.p > 0 && slotClosed(date, dow, h)) n.f = Math.max(n.f, n.v - n.p);
  return n;
}
function slotsOfDoc(doc, date) {
  const dow = dowOf(pISO(date)), out = [];
  if (doc && doc.s) Object.keys(doc.s).forEach(k => {
    const n = effSlot(doc.s[k], date, dow, +k);
    if (n.v + n.p + n.r + n.f > 0) out.push(Object.assign({ h: +k }, n));
  });
  return out;
}
const docTot = (doc, date) => {
  const t = { v: 0, p: 0, r: 0, f: 0, cap: 0 };
  slotsOfDoc(doc, date).forEach(s => { t.v += s.v; t.p += s.p; t.r += s.r; t.f += s.f; t.cap += s.cap; });
  return t;
};
const hasData = (doc, date) => !!doc && !doc.off && slotsOfDoc(doc, date).length > 0;
const anyData = days => Object.keys(days).some(k => hasData(days[k], k));

function legacyDays() {
  const raw = ls.get(LS1); if (!raw) return null;
  try {
    const o = JSON.parse(raw), out = {};
    Object.keys(o).forEach(d => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return;
      const s = {};
      Object.keys(o[d] || {}).forEach(k => {
        const e = o[d][k] || {}, q = { v: clamp(e.a), p: clamp(e.p), r: clamp(e.r), f: clamp(e.f) };
        if (q.v + q.p + q.r + q.f > 0) s[k] = q;
      });
      if (Object.keys(s).length) out[d] = { d, s, t: 0 };
    });
    return Object.keys(out).length ? out : null;
  } catch (e) { return null; }
}
function loadLocal() {
  const raw = ls.get(LS2);
  if (raw) {
    try { const o = JSON.parse(raw); S.days = o.dias || {}; const c = o.cfg || {}; S.logo = c.logo || ''; delete c.logo; S.cfg = Object.assign(S.cfg, c); return; } catch (e) { /* segue */ }
  }
  S.days = legacyDays() || {};
}
const saveLocal = () => ls.set(LS2, JSON.stringify({ dias: S.days, cfg: Object.assign({}, S.cfg, { logo: S.logo }) }));
const okNum = (k, v) => typeof v === 'number' && v >= 1 && v <= (k === 'meta' ? 100 : k === 'tol' ? 90 : 999);

function startLocal() {
  if (S.mode !== 'loading') return;
  S.mode = 'local'; loadLocal(); S.loaded = true; S.synced = true; paintBrand(); renderAll();
}
function startDb(db) {
  S.mode = 'db'; S.dbh = db;
  const timer = setTimeout(() => { if (!S.synced) { S.slow = true; paintConn(); } }, 10000);
  db.collection('dias').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (d.exists) m[d.id] = d.data(); });
    S.days = m; S.loaded = true; S.err = null;
    if (!snap.metadata.fromCache) { S.synced = true; S.slow = false; clearTimeout(timer); }
    renderAll();
  }, e => { S.err = (e && e.code) || 'unavailable'; S.loaded = true; renderAll(); });
  db.doc('config/geral').onSnapshot(s => {
    if (s.exists) {
      const c = s.data() || {};
      ['meta', 'capSem', 'capSab', 'tol'].forEach(k => { if (okNum(k, c[k])) S.cfg[k] = Math.round(c[k]); });
      if (c.avisos && typeof c.avisos === 'object') S.cfg.avisos = c.avisos;
      if (typeof c.escola === 'string') S.cfg.escola = c.escola.slice(0, 60);
      if (typeof c.cor === 'string' && PAL[c.cor]) S.cfg.cor = c.cor;
    }
    paintBrand(); renderAll();
  }, () => {});
  db.doc('config/logo').onSnapshot(s => { S.logo = (s.exists && s.data() && typeof s.data().img === 'string') ? s.data().img : ''; paintBrand(); if (S.tab === 'preencher') renderSettings(); }, () => {});
}
function init() {
  paintBrand(); renderAll();
  if (!window.claude || !window.claude.use) { startLocal(); return; }
  const t = setTimeout(startLocal, 12000);
  window.claude.use('db').then(db => {
    clearTimeout(t);
    if (S.mode !== 'loading') return;
    db ? startDb(db) : startLocal();
  }).catch(() => { clearTimeout(t); startLocal(); });
}

async function persistDay(date, doc) {
  doc.d = date;
  if (S.mode === 'db') await S.dbh.collection('dias').doc(date).set(doc);
  S.days = Object.assign({}, S.days, { [date]: doc });
  if (S.mode !== 'db' && !saveLocal()) throw { code: 'storage' };
}
async function persistDelete(date) {
  if (S.mode === 'db') await S.dbh.collection('dias').doc(date).delete();
  const m = Object.assign({}, S.days); delete m[date]; S.days = m;
  if (S.mode !== 'db' && !saveLocal()) throw { code: 'storage' };
}
async function persistCfg(k, v) {
  S.cfg[k] = v;
  if (S.mode === 'db') await S.dbh.doc('config/geral').set({ meta: S.cfg.meta, capSem: S.cfg.capSem, capSab: S.cfg.capSab, escola: S.cfg.escola, cor: S.cfg.cor, tol: S.cfg.tol, avisos: S.cfg.avisos || {} });
  else if (!saveLocal()) throw { code: 'storage' };
}
async function persistLogo(img) {
  S.logo = img || '';
  if (S.mode === 'db') await S.dbh.doc('config/logo').set({ img: S.logo });
  else if (!saveLocal()) throw { code: 'storage' };
}
function errMsg(e) {
  const c = e && e.code;
  if (c === 'invalid_argument' || c === 'permission-denied') return 'Sem permissão para salvar. Peça ao dono da página acesso de edição.';
  if (c === 'quota_exceeded' || c === 'resource-exhausted') return 'O limite de armazenamento foi atingido. Avise quem administra a página.';
  if (c === 'storage') return 'Este navegador não permite salvar. Copie os dados para o Excel para não perder.';
  return 'Não foi possível salvar agora. Tente de novo em instantes.';
}

/* ---------- marca da escola ---------- */
const PAL = {
  azul:    { n: 'Azul',    l: ['#2a78d6', '#1c5cab', '#1f64bd', '#ffffff'], d: ['#3987e5', '#86b6ef', '#6da7ec', '#0b1018'] },
  verde:   { n: 'Verde',   l: ['#1b9a68', '#11694a', '#157a52', '#ffffff'], d: ['#3fc38d', '#7fdcb4', '#5ccf9f', '#0b1a13'] },
  roxo:    { n: 'Roxo',    l: ['#6250d6', '#4a3aa7', '#5342c4', '#ffffff'], d: ['#9085e9', '#b5adf2', '#a79df0', '#120f26'] },
  laranja: { n: 'Laranja', l: ['#e0661f', '#a64a12', '#c4560f', '#ffffff'], d: ['#f08a4b', '#f6b07f', '#f59a60', '#1f1005'] },
  vermelho:{ n: 'Vermelho',l: ['#d03b3b', '#a22b2b', '#b82f2f', '#ffffff'], d: ['#ee7070', '#f5a0a0', '#f28585', '#240808'] },
  grafite: { n: 'Grafite', l: ['#475569', '#334155', '#334155', '#ffffff'], d: ['#94a3b8', '#cbd5e1', '#a8b5c7', '#0f1620'] }
};
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function paintBrand() {
  const p = PAL[S.cfg.cor] || PAL.azul;
  const set = (c, soft) => `--accent:${c[0]};--accent-text:${c[1]};--accent-soft:${rgba(c[0], soft)};--btn:${c[2]};--btn-ink:${c[3]};`;
  let st = $('#brandStyle');
  if (!st) { st = document.createElement('style'); st.id = 'brandStyle'; document.body.appendChild(st); }
  st.textContent = `html:root{${set(p.l, .12)}}@media (prefers-color-scheme: dark){html:root:not([data-theme="light"]){${set(p.d, .2)}}}html:root[data-theme="dark"]{${set(p.d, .2)}}`;
  const b = $('#brand');
  b.innerHTML = (S.logo ? `<img src="${esc(S.logo)}" alt="Logo da escola">` : '') + `<div>${S.cfg.escola ? `<div class="eyebrow">${esc(S.cfg.escola)}</div>` : ''}<h1>Controle de Alunos</h1><p class="sub" id="today"></p></div>`;
  paintConn();
}

/* ---------- cálculos ---------- */
function agg(days, from, to) {
  const R = { t: { v: 0, p: 0, r: 0, f: 0, cap: 0 }, n: 0, off: 0, pending: [], byDay: [], cell: {}, hour: {}, issues: 0, slotsN: 0, list: [] };
  const td = today();
  for (let d = from; d <= to; d = addD(d, 1)) {
    const dow = dowOf(d); if (dow === 6 || d > td) continue;
    const key = iso(d), doc = days[key];
    if (!doc) { if (d < td) R.pending.push(key); R.list.push({ date: key, d, dow, t: null }); continue; }
    if (doc.off) { R.off++; continue; }
    const sl = slotsOfDoc(doc, key);
    if (!sl.length) { R.list.push({ date: key, d, dow, t: null }); continue; }
    const t = { v: 0, p: 0, r: 0, f: 0, cap: 0 };
    sl.forEach(s => {
      ['v', 'p', 'r', 'f', 'cap'].forEach(m => { t[m] += s[m]; R.t[m] += s[m]; });
      const c = R.cell[dow + '-' + s.h] = R.cell[dow + '-' + s.h] || { v: 0, p: 0, r: 0, f: 0, cap: 0 };
      ['v', 'p', 'r', 'f', 'cap'].forEach(m => { c[m] += s[m]; });
      const o = R.hour[s.h] = R.hour[s.h] || { v: 0, cap: 0, n: 0, sala: 0, pico: 0, f: 0, ratios: [] };
      o.v += s.v; o.cap += s.cap; o.n++; o.sala += s.p + s.r; o.f += s.f; o.pico = Math.max(o.pico, s.p + s.r); R.slotsN++;
      if (s.v > 0 && s.p > 0 && slotClosed(key, dow, s.h)) o.ratios.push((s.p + s.r) / s.v);
      if (s.p + s.f > s.v || s.v > s.cap) R.issues++;
    });
    R.n++;
    const row = { date: key, d, dow, t };
    R.byDay.push(row); R.list.push(row);
  }
  return R;
}
function rangeOf(key) {
  const td = today(); let f = td;
  if (key === '7') f = addD(td, -6);
  else if (key === '30') f = addD(td, -29);
  else if (key === 'mes') f = new Date(td.getFullYear(), td.getMonth(), 1);
  else if (key === 'tudo') { const ks = Object.keys(getDays()).sort(); f = ks.length ? pISO(ks[0]) : td; }
  return [f, td];
}
function prevRange(key, f, t) {
  if (key === 'tudo') return null;
  if (key === 'hoje') {
    for (let i = 1; i <= 14; i++) { const d = addD(t, -i); if (hasData(getDays()[iso(d)], iso(d))) return [d, d]; }
    return null;
  }
  const n = Math.round((t - f) / 864e5) + 1;
  if (key === 'mes') { const pf = new Date(f.getFullYear(), f.getMonth() - 1, 1); return [pf, addD(pf, n - 1)]; }
  return [addD(f, -n), addD(f, -1)];
}
const RANGES = [['hoje', 'Hoje'], ['7', '7 dias'], ['30', '30 dias'], ['mes', 'Este mês'], ['tudo', 'Tudo']];

/* ---------- dados de exemplo (só na tela, nunca salvos) ---------- */
function makeDemo() {
  const out = {}; let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const td = today();
  for (let i = 45; i >= 0; i--) {
    const d = addD(td, -i), dow = dowOf(d); if (dow === 6) continue;
    if (i > 0 && rnd() < .04) { out[iso(d)] = { off: true }; continue; }
    const s = {}, cap = dow === 5 ? 25 : 10;
    slotsOf(dow).forEach(h => {
      if (i === 0 && h > new Date().getHours()) return;
      const v = Math.max(2, Math.min(cap, Math.round(cap * (.4 + rnd() * .5) + (h >= 18 ? cap * .1 : 0))));
      const pf = .07 + (dow === 0 ? .09 : 0) + (h >= 18 ? .06 : 0) + (dow === 4 ? .05 : 0);
      let f = 0; for (let j = 0; j < v; j++) if (rnd() < pf) f++;
      const r = rnd() < .35 ? 1 + (rnd() < .4 ? 1 : 0) : 0;
      s[pad(h)] = { cap, v, p: v - f, r, f };
    });
    out[iso(d)] = { s };
  }
  return out;
}

/* ---------- cabeçalho, abas, status ---------- */
function paintConn() {
  const el = $('#conn'), tx = $('#connTx');
  let cls = 'conn', t = 'Conectando…';
  if (S.mode === 'db') {
    if (S.err) { cls += ' bad'; t = 'Sem acesso aos dados compartilhados'; }
    else if (S.slow) { cls += ' warn'; t = 'Servidor sem resposta, dados podem estar desatualizados'; }
    else if (!S.synced) { cls += ' warn'; t = 'Sincronizando…'; }
    else { cls += ' on'; t = 'Dados compartilhados'; }
  } else if (S.mode === 'local') { cls += ' warn'; t = 'Salvo só neste navegador'; }
  el.className = cls; tx.textContent = t;
  const d = today(), td = $('#today');

function resizeLogo(file) {
